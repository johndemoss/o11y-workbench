receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:14317
      http:
        endpoint: 0.0.0.0:14318
processors:
  batch:
    timeout: 1s
    send_batch_size: 100
  remotetap:
    endpoint: 0.0.0.0:12001
    limit: 10
exporters:
  debug:
    verbosity: detailed
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, remotetap]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [batch, remotetap]
      exporters: [debug]