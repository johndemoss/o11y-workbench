# Deprecated: prefer docker-compose.yml + docker-compose.dev-remotetap.yml.

services:
  otel-collector:
    profiles:
      - remotetap

  o11y-workbench-web:
    profiles:
      - remotetap

  demo-sender:
    profiles:
      - remotetap
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:14317
    restart: on-failure:5
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 10
        /usr/local/bin/o11y-workbench --traces 0 --duration 0 --rate 2 --output otlp --endpoint otel-collector:14317 --insecure --scenario microservice
    depends_on:
      - otel-collector