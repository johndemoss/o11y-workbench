# Deprecated: prefer docker-compose.yml (+ profiles). Retained for manual experiments only.

services:
  otel-collector:
    image: docker.io/otel/opentelemetry-collector-contrib:0.165.0@sha256:e40d61f10c9a617cca1ffd1be4d7e2b3a4b0f0001798ff07e58cabe82e618cea
    container_name: otel-collector-remotetap
    volumes:
      - ./config/otel-collector-remotetap.yaml:/etc/otelcol-contrib/config.yaml:ro,Z
    ports:
      - "127.0.0.1:14317:14317"
      - "127.0.0.1:14318:14318"
      - "127.0.0.1:12001:12001"
    mem_limit: 512m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    networks:
      - o11y-workbench-net
    profiles:
      - remotetap

  o11y-workbench-web:
    image: localhost/o11y-workbench-web:latest
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: o11y-workbench-web
    ports:
      - "127.0.0.1:${WEB_PORT:-18080}:8080"
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=67108864
    mem_limit: 512m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    environment:
      - O11Y_WORKBENCH_PIPELINE_PROTOTYPER=true
      - O11Y_WORKBENCH_LOG_LEVEL=debug
    networks:
      - o11y-workbench-net
    depends_on:
      - otel-collector
    profiles:
      - remotetap

  demo-sender:
    image: localhost/o11y-workbench-cli:latest
    build:
      context: .
      dockerfile: Dockerfile.cli
    container_name: demo-sender
    command:
      - --traces
      - "0"
      - --duration
      - "0"
      - --rate
      - "2"
      - --output
      - otlp
      - --endpoint
      - otel-collector:14317
      - --insecure
      - --scenario
      - microservice
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=67108864
    mem_limit: 256m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    networks:
      - o11y-workbench-net
    depends_on:
      - otel-collector
    profiles:
      - dev
      - remotetap

networks:
  o11y-workbench-net:
    name: o11y-workbench-net
    driver: bridge