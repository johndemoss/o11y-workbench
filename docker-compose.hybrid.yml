# Hybrid setup for macOS ARM64
# Uses host network for otel-desktop-viewer binary (runs on host, not in container)
# Containerizes other services

services:
  # Run otel-desktop-viewer on the host instead (not in container)
  # Use: make otel-desktop-viewer-start

  # OTel Collector with remotetap processor
  otel-collector:
    image: docker.io/otel/opentelemetry-collector-contrib:0.151.0@sha256:d57bfe8eee2378f31cb1193239fbcac521d54a5a071fca2bfc106916a32b892d
    container_name: otel-collector-remotetap
    volumes:
      - ./config/otel-collector-remotetap.yaml:/etc/otelcol-contrib/config.yaml:ro,Z
    ports:
      - "127.0.0.1:14317:14317"
      - "127.0.0.1:14318:14318"
      - "127.0.0.1:12001:12001"
    mem_limit: 512m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    networks:
      - o11y-workbench-net
    profiles:
      - remotetap

  # O11y Workbench Web
  o11y-workbench-web:
    image: localhost/o11y-workbench-web:latest
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: o11y-workbench-web
    ports:
      # Host port defaults to 18080 so it does not clash with other listeners on :8080.
      - "127.0.0.1:${WEB_PORT:-18080}:8080"
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=67108864
    mem_limit: 512m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    environment:
      - O11Y_WORKBENCH_PIPELINE_PROTOTYPER=true
      - O11Y_WORKBENCH_LOG_LEVEL=debug
    networks:
      - o11y-workbench-net
    depends_on:
      - otel-collector
    profiles:
      - remotetap

  # Demo Sender
  demo-sender:
    image: localhost/o11y-workbench-cli:latest
    build:
      context: .
      dockerfile: Dockerfile.cli
    container_name: demo-sender
    # Use host.containers.internal (podman's host machine hostname)
    command:
      - --traces
      - "0"
      - --duration
      - "0"
      - --rate
      - "2"
      - --output
      - otlp
      - --endpoint
      - host.containers.internal:4317
      - --insecure
      - --scenario
      - microservice
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=67108864
    mem_limit: 256m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    networks:
      - o11y-workbench-net
    profiles:
      - dev

networks:
  o11y-workbench-net:
    name: o11y-workbench-net
    driver: bridge
