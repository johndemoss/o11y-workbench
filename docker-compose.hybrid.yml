# Hybrid setup for macOS ARM64
# Uses host network for otel-desktop-viewer binary (runs on host, not in container)
# Containerizes other services

services:
  # Run otel-desktop-viewer on the host instead (not in container)
  # Use: make otel-desktop-viewer-start

  # OTel Collector with remotetap processor
  otel-collector:
    image: otel/opentelemetry-collector-contrib:${OTEL_COLLECTOR_CONTRIB_VERSION:-0.151.0}
    container_name: otel-collector-remotetap
    volumes:
      - ./config/otel-collector-remotetap.yaml:/etc/otelcol-contrib/config.yaml:ro,Z
    ports:
      - "14317:14317"
      - "14318:14318"
      - "12001:12001"
    networks:
      - o11y-workbench-net
    profiles:
      - remotetap

  # O11y Workbench Web
  o11y-workbench-web:
    image: localhost/o11y-workbench-web:latest
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: o11y-workbench-web
    ports:
      # Host WEB_PORT (default 18080) avoids clash with a local process on :8080.
      - "${WEB_PORT:-18080}:8080"
    environment:
      - O11Y_WORKBENCH_PIPELINE_PROTOTYPER=true
      - O11Y_WORKBENCH_LOG_LEVEL=debug
    networks:
      - o11y-workbench-net
    depends_on:
      - otel-collector
    profiles:
      - remotetap

  # Demo Sender
  demo-sender:
    image: localhost/o11y-workbench-cli:latest
    build:
      context: .
      dockerfile: Dockerfile.cli
    container_name: demo-sender
    # Use host.containers.internal (podman's host machine hostname)
    command:
      - --traces
      - "0"
      - --duration
      - "0"
      - --rate
      - "2"
      - --output
      - otlp
      - --endpoint
      - host.containers.internal:4317
      - --insecure
      - --scenario
      - microservice
    networks:
      - o11y-workbench-net
    profiles:
      - dev

networks:
  o11y-workbench-net:
    name: o11y-workbench-net
    driver: bridge
