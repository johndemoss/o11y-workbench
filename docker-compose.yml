services:
  # OTel Collector with remotetap processor
  otel-collector:
    image: docker.io/otel/opentelemetry-collector-contrib:0.165.0@sha256:e40d61f10c9a617cca1ffd1be4d7e2b3a4b0f0001798ff07e58cabe82e618cea
    container_name: otel-collector-remotetap
    volumes:
      - ./config/otel-collector-remotetap.yaml:/etc/otelcol-contrib/config.yaml:ro,Z
    ports:
      - "127.0.0.1:14317:14317"  # OTLP gRPC
      - "127.0.0.1:14318:14318"  # OTLP HTTP
      - "127.0.0.1:12001:12001"  # remotetap WebSocket
    mem_limit: 512m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    networks:
      - o11y-workbench-net
    profiles:
      - remotetap  # Only starts with dev-remotetap mode

  # OTel Desktop Viewer (OTLP GUI) — optional demo; official multiarch image (dev profile only)
  otel-desktop-viewer:
    image: ghcr.io/ctrlspice/otel-desktop-viewer:v0.7.0@sha256:e1bcd2a895c0e62b1ae97988cbf132d270074cb239b5c37efe59348a60a82ce8
    container_name: otel-desktop-viewer
    ports:
      - "127.0.0.1:4317:4317"  # OTLP gRPC
      - "127.0.0.1:4318:4318"  # OTLP HTTP
      - "127.0.0.1:8000:8000"  # Web UI
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=67108864
    mem_limit: 512m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    networks:
      - o11y-workbench-net
    profiles:
      - dev  # Optional demo only (make dev)

  # O11y Workbench Web (Dashboard & Pipeline Prototyper)
  o11y-workbench-web:
    image: localhost/o11y-workbench-web:latest
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: o11y-workbench-web
    ports:
      # Host port defaults to 18080 so it does not clash with other listeners on :8080.
      - "127.0.0.1:${WEB_PORT:-18080}:8080"
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=67108864
    mem_limit: 512m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    environment:
      - O11Y_WORKBENCH_PIPELINE_PROTOTYPER=true
      - O11Y_WORKBENCH_LOG_LEVEL=debug
    networks:
      - o11y-workbench-net
    depends_on:
      - otel-collector
    profiles:
      - remotetap  # Only starts with dev-remotetap mode

  # Demo Sender (CLI sending traces)
  demo-sender:
    image: localhost/o11y-workbench-cli:latest
    build:
      context: .
      dockerfile: Dockerfile.cli
    container_name: demo-sender
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-desktop-viewer:4317
    command:
      - --traces
      - "0"
      - --duration
      - "300"
      - --rate
      - "5"
      - --output
      - otlp
      - --endpoint
      - otel-desktop-viewer:4317
      - --insecure
    networks:
      - o11y-workbench-net
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=67108864
    mem_limit: 256m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    restart: on-failure:5
    depends_on:
      - otel-desktop-viewer
    profiles:
      - dev  # Optional demo only (make dev)

networks:
  o11y-workbench-net:
    name: o11y-workbench-net
    driver: bridge
