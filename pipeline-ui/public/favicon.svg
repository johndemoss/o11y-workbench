<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!--
    CONCEPT 2: Otter Icon Mark
    Simplified geometric otter face designed for small-size applications
    (favicon, app icon, badge). Warm amber face with lighter muzzle, dark
    eyes with teal catchlights, and six waveform whiskers (3 per side).
    Minimal shapes ensure legibility at 32×32 and below while signal-wave
    whiskers keep the observability connection.
  -->
  <rect width="200" height="200" rx="40" fill="#0f172a"/>

  <!-- ============================================================ -->
  <!-- HEAD                                                            -->
  <!-- ============================================================ -->

  <!-- Head base — wide circle for otter's round face -->
  <circle cx="100" cy="108" r="64" fill="#d97706"/>

  <!-- Cheek accents — subtle wider shape below eyes (otter face structure) -->
  <ellipse cx="100" cy="115" rx="68" ry="42" fill="#d97706" opacity="0.4"/>

  <!-- Muzzle — lighter patch on lower face for warmth and dimension -->
  <ellipse cx="100" cy="122" rx="38" ry="28" fill="#fbbf24"/>

  <!-- ============================================================ -->
  <!-- EARS — small, rounded, classic otter                          -->
  <!-- ============================================================ -->
  <circle cx="50" cy="62" r="17" fill="#d97706"/>
  <circle cx="150" cy="62" r="17" fill="#d97706"/>
  <!-- Inner ear shadows -->
  <circle cx="50" cy="62" r="9" fill="#1e293b" opacity="0.45"/>
  <circle cx="150" cy="62" r="9" fill="#1e293b" opacity="0.45"/>

  <!-- ============================================================ -->
  <!-- EYES — large, dark, with teal-tinted catchlights              -->
  <!-- ============================================================ -->
  <circle cx="78" cy="102" r="12" fill="#0f172a"/>
  <circle cx="122" cy="102" r="12" fill="#0f172a"/>
  <!-- Primary catchlights (teal = brand connection) -->
  <circle cx="82" cy="98" r="4.5" fill="#ccfbf1"/>
  <circle cx="126" cy="98" r="4.5" fill="#ccfbf1"/>
  <!-- Secondary catchlights (small reflection offset) -->
  <circle cx="75" cy="106" r="2" fill="#5eead4" opacity="0.5"/>
  <circle cx="119" cy="106" r="2" fill="#5eead4" opacity="0.5"/>

  <!-- ============================================================ -->
  <!-- NOSE — dark, rounded, centered on muzzle                      -->
  <!-- ============================================================ -->
  <ellipse cx="100" cy="126" rx="12" ry="8" fill="#1e293b"/>
  <!-- Nose highlight -->
  <ellipse cx="100" cy="124" rx="5" ry="3" fill="#475569"/>

  <!-- Subtle smile -->
  <path d="M 90 134 Q 100 140 110 134" stroke="#1e293b" fill="none" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>

  <!-- ============================================================ -->
  <!-- WHISKERS — signal-waveform style, 3 per side                  -->
  <!-- Each whisker follows a subtle S-curve (╱╲╱) like a trace      -->
  <!-- Thicker strokes (3px) ensure visibility at favicon sizes      -->
  <!-- ============================================================ -->

  <!-- Left whiskers — waveform S-curves radiating outward -->
  <path d="M 64 116 C 46 108, 38 126, 22 118" stroke="#94a3b8" fill="none" stroke-width="3" stroke-linecap="round"/>
  <path d="M 62 126 C 44 120, 36 138, 20 132" stroke="#94a3b8" fill="none" stroke-width="3" stroke-linecap="round"/>
  <path d="M 64 136 C 48 132, 40 150, 26 144" stroke="#94a3b8" fill="none" stroke-width="3" stroke-linecap="round"/>

  <!-- Right whiskers — symmetric waveform S-curves -->
  <path d="M 136 116 C 154 108, 162 126, 178 118" stroke="#94a3b8" fill="none" stroke-width="3" stroke-linecap="round"/>
  <path d="M 138 126 C 156 120, 164 138, 180 132" stroke="#94a3b8" fill="none" stroke-width="3" stroke-linecap="round"/>
  <path d="M 136 136 C 152 132, 160 150, 174 144" stroke="#94a3b8" fill="none" stroke-width="3" stroke-linecap="round"/>

  <!-- ============================================================ -->
  <!-- Subtle span-bar nod — invisible at small sizes, adds context  -->
  <!-- at larger display sizes (favicon 32+). A tiny teal line that  -->
  <!-- suggests the workbench/span connection underpinning the brand  -->
  <!-- ============================================================ -->
  <rect x="76" y="172" width="48" height="4" rx="2" fill="#0d9488" opacity="0.3"/>
  <rect x="84" y="172" width="12" height="4" rx="2" fill="#14b8a6" opacity="0.4"/>
</svg>
