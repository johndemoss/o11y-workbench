# Override for 'make dev-remotetap' mode
# Adds remotetap-demo-sender (separate service so compose merge cannot inherit dev demo-sender depends_on).

services:
  remotetap-demo-sender:
    image: localhost/o11y-workbench-cli:latest
    build:
      context: .
      dockerfile: Dockerfile.cli
    container_name: remotetap-demo-sender
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:14317
    command:
      - --traces
      - "0"
      - --duration
      - "0"
      - --rate
      - "2"
      - --output
      - otlp
      - --endpoint
      - otel-collector:14317
      - --insecure
      - --scenario
      - microservice
    networks:
      - o11y-workbench-net
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=67108864
    mem_limit: 256m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    restart: on-failure:5
    depends_on:
      - otel-collector
    profiles:
      - remotetap