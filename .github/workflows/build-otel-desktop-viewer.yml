name: Build otel-desktop-viewer

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-otel-desktop-viewer.yml'
      - 'bin/**'

jobs:
  build:
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - goos: linux
            goarch: arm64
            runner: ubuntu-latest
          - goos: darwin
            goarch: amd64
            runner: macos-latest
          - goos: darwin
            goarch: arm64
            runner: macos-latest

    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout o11y-workbench
        uses: actions/checkout@v4

      - name: Checkout otel-desktop-viewer
        uses: actions/checkout@v4
        with:
          repository: ctrlspice/otel-desktop-viewer
          path: otel-desktop-viewer-src
          fetch-depth: 0

      - name: Get version
        id: version
        run: |
          VERSION=$(git -C otel-desktop-viewer-src describe --tags --always)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building otel-desktop-viewer $VERSION for ${{ matrix.goos }}-${{ matrix.goarch }}"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build
        env:
          CGO_ENABLED: '1'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          cd otel-desktop-viewer-src
          go build -ldflags="-s -w -X main.version=${{ steps.version.outputs.version }}" \
            -o ../bin/otel-desktop-viewer-${{ matrix.goos }}-${{ matrix.goarch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: otel-desktop-viewer-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/otel-desktop-viewer-${{ matrix.goos }}-${{ matrix.goarch }}
          retention-days: 30

  all-artifacts:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: bin
          merge-multiple: true

      - name: List built artifacts
        run: ls -lh bin/