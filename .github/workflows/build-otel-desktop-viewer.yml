name: Build otel-desktop-viewer

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-otel-desktop-viewer.yml'
      - 'bin/**'

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - goos: darwin
            goarch: amd64
            runner: macos-latest
          - goos: darwin
            goarch: arm64
            runner: macos-latest

    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout o11y-workbench
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Checkout otel-desktop-viewer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: ctrlspice/otel-desktop-viewer
          path: otel-desktop-viewer-src
          fetch-depth: 0

      - name: Get version
        id: version
        run: |
          VERSION=$(git -C otel-desktop-viewer-src describe --tags --always)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building otel-desktop-viewer $VERSION for ${{ matrix.goos }}-${{ matrix.goarch }}"

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.11'

      - name: Build
        env:
          CGO_ENABLED: '1'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd otel-desktop-viewer-src
          go build -ldflags="-s -w -X main.version=${BUILD_VERSION}" \
            -o ../bin/otel-desktop-viewer-${{ matrix.goos }}-${{ matrix.goarch }}

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: otel-desktop-viewer-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/otel-desktop-viewer-${{ matrix.goos }}-${{ matrix.goarch }}
          retention-days: 30

  all-artifacts:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: bin
          merge-multiple: true

      - name: List built artifacts
        run: ls -lh bin/