name: CI checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

concurrency:
  # Superseded runs on the same ref are cancelled instead of queueing.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install pinned local secret scanner
        run: go install github.com/zricethezav/gitleaks/v8@v8.24.3
      - name: Container pins and loopback-only publishes
        run: ./scripts/check-publication.sh
      - name: Scan tracked tree and reachable history without publishing matches
        run: ./scripts/check-secrets.sh

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            workers/ottl-0.163/go.sum
            workers/ottl-0.164/go.sum
      - name: Install pinned Go check tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - name: Build extra-train OTTL workers
        run: make ottl-workers
      - run: ./scripts/check-go.sh
        env:
          O11Y_REQUIRE_WORKERS: '1'

  ui:
    # Component Playwright's pinned Chromium does not support Ubuntu 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        directory: [pipeline-ui]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            workers/ottl-0.163/go.sum
            workers/ottl-0.164/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ct
      - name: Build the pipeline UI and a test-owned API backend
        working-directory: .
        run: |
          make ottl-workers
          ./scripts/build-ui.sh pipeline-ui
          rt=$(mktemp -d "$RUNNER_TEMP/o11y-e2e.XXXXXX")
          chmod 700 "$rt"
          go build -o "$rt/o11y-workbench-web" ./cmd/o11y-workbench-web
          echo "O11Y_E2E_RUNTIME_DIR=$rt" >> "$GITHUB_ENV"
      - name: Pipeline UI browser suite against a test-owned backend
        run: |
          set -euo pipefail
          if curl -fsS --max-time 2 http://127.0.0.1:18080/api/health >/dev/null 2>&1; then
            echo "ERROR: port 18080 is already serving a backend; refusing to adopt a foreign listener" >&2
            exit 1
          fi
          O11Y_WORKBENCH_RUNTIME_DIR="$O11Y_E2E_RUNTIME_DIR" ../scripts/serve.sh --foreground --addr 127.0.0.1:18080 --skip-build \
            >"$RUNNER_TEMP/o11y-e2e-backend.log" 2>&1 &
          backend=$!
          trap 'kill "$backend" 2>/dev/null || true; wait "$backend" 2>/dev/null || true' EXIT
          ready=false
          for _ in $(seq 1 60); do
            if ! kill -0 "$backend" 2>/dev/null; then
              cat "$RUNNER_TEMP/o11y-e2e-backend.log" >&2
              exit 1
            fi
            if curl -fsS http://127.0.0.1:18080/api/health >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat "$RUNNER_TEMP/o11y-e2e-backend.log" >&2
            exit 1
          fi
          npm run test:e2e
      - name: Upload Pipeline UI browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pipeline-ui-playwright-${{ github.run_id }}
          path: pipeline-ui/test-results/
          retention-days: 7
          if-no-files-found: ignore
      - run: npm run build
      - name: Verify generated entry-point assets
        run: node ../scripts/check-ui-assets.mjs dist /pipeline/
      - run: npm audit --audit-level=moderate

  embedded-ui-and-browser:
    # Playwright 1.60 has no Chromium build for ubuntu-latest, which is 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            pipeline-ui/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=moderate
      - name: Install pinned Playwright Chromium and Ubuntu runtime dependencies
        run: npx playwright install --with-deps chromium
      - name: Build the pipeline UI through go generate
        run: go generate ./cmd/o11y-workbench-web
      - name: Verify actual embedded entry points and assets
        run: O11Y_REQUIRE_BUILT_UI=1 go test ./internal/server -run '^TestEmbeddedUI'
      - run: go build ./cmd/o11y-workbench-web
      - name: Browser smoke against a freshly built, test-owned foreground server
        run: npm run test:browser
      - name: Upload root browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: root-playwright-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Foreground testing must not create a daemon PID record
        run: test ! -e .run/o11y-workbench-web.pid
      - name: Generated assets must not dirty tracked files
        run: test -z "$(git status --porcelain)"
